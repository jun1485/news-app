name: 아침 뉴스 갱신

# 한국 시간 오전 8시 전후에 카테고리별 뉴스 생성 후 KV 적재
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 뉴스 생성 및 KV 적재
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/generate-digests.mjs
